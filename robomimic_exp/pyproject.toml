[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doobpo-robomimic"
version = "1.0.0"
description = "DoobPO fine-tuning of diffusion and flow policies on Robomimic (built on ReinFlow / DPPO)."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "av==12.3.0",
    "einops==0.8.0",
    "gdown==5.2.0",
    "gym==0.22.0",
    "hydra-core==1.3.2",
    "imageio==2.35.1",
    "matplotlib==3.7.5",
    "omegaconf==2.3.0",
    "torch>=2.4.0",
    "tqdm==4.66.5",
    "wandb==0.17.7",
]

[tool.setuptools.packages.find]
exclude = []
