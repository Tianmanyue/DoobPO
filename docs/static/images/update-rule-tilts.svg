<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">One reference policy, two rule-specific distribution tilts</title>
  <desc id="desc">Schematic for one observation: a shared reference action distribution branches through PPO and GRPO update rules. Each right-hand plot overlays an illustrative tilted target on the same dashed reference distribution. The target is proportional to the rule's learned positive auxiliary ratio times the reference policy; the depicted tilt directions are not fixed properties of either rule.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#8b98a6"/>
    </marker>
  </defs>

  <!-- Shared reference distribution. -->
  <rect x="40.5" y="78.5" width="307" height="192" rx="4" fill="#fff" stroke="#dce3ea"/>
  <text x="64" y="107" fill="#222b36" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="600">Reference policy</text>
  <text x="64" y="126" fill="#687684" font-family="Noto Sans, Arial, sans-serif" font-size="18">π<tspan baseline-shift="sub" font-size="12">old</tspan><tspan> (a | o)</tspan></text>
  <path d="M 65 239 H 324" stroke="#b7c2cc" stroke-width="1"/>
  <path d="M 65 239 C 106 239 125 236 145 216 C 161 199 169 161 191 157 C 213 153 223 184 239 212 C 255 236 276 239 324 239 L 65 239 Z" fill="#eef1f4"/>
  <path d="M 65 239 C 106 239 125 236 145 216 C 161 199 169 161 191 157 C 213 153 223 184 239 212 C 255 236 276 239 324 239" fill="none" stroke="#677889" stroke-width="2.4" stroke-linecap="round"/>
  <text x="306" y="257" fill="#8793a0" font-family="Noto Sans, Arial, sans-serif" font-size="16">a</text>

  <!-- The same base feeds two different update rules. -->
  <path d="M 348 174 H 457" fill="none" stroke="#9aa7b4" stroke-width="1.5"/>
  <circle cx="457" cy="174" r="3" fill="#9aa7b4"/>
  <path d="M 457 174 L 551 95" fill="none" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 457 174 L 551 241" fill="none" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="130" fill="#3273dc" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="600">r<tspan baseline-shift="sub" font-size="12">PPO</tspan><tspan> &gt; 0</tspan></text>
  <text x="365" y="232" fill="#2b9697" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="600">r<tspan baseline-shift="sub" font-size="12">GRPO</tspan><tspan> &gt; 0</tspan></text>

  <!-- PPO: gray is the very same reference curve; blue is an illustrative tilt. -->
  <rect x="570.5" y="20.5" width="348" height="133" rx="4" fill="#fff" stroke="#dce3ea"/>
  <text x="594" y="48" fill="#222b36" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="600">PPO tilt</text>
  <text x="849" y="47" fill="#8995a1" font-family="Noto Sans, Arial, sans-serif" font-size="16">target</text>
  <path d="M 594 130 H 895" stroke="#b7c2cc" stroke-width="1"/>
  <path d="M 594 130 C 633 130 655 127 676 112 C 693 98 704 75 729 73 C 749 72 760 96 776 113 C 797 129 824 130 895 130" fill="none" stroke="#a7b2bd" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M 594 130 C 654 130 685 127 708 117 C 732 105 745 75 768 73 C 793 72 806 103 826 118 C 844 128 866 130 895 130 L 594 130 Z" fill="#3273dc" fill-opacity="0.09"/>
  <path d="M 594 130 C 654 130 685 127 708 117 C 732 105 745 75 768 73 C 793 72 806 103 826 118 C 844 128 866 130 895 130" fill="none" stroke="#3273dc" stroke-width="2.6" stroke-linecap="round"/>
  <text x="882" y="146" fill="#8793a0" font-family="Noto Sans, Arial, sans-serif" font-size="16">a</text>

  <!-- GRPO: the dashed reference has exactly the same shape and position. -->
  <rect x="570.5" y="168.5" width="348" height="133" rx="4" fill="#fff" stroke="#dce3ea"/>
  <text x="594" y="196" fill="#222b36" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="600">GRPO tilt</text>
  <text x="849" y="195" fill="#8995a1" font-family="Noto Sans, Arial, sans-serif" font-size="16">target</text>
  <path d="M 594 278 H 895" stroke="#b7c2cc" stroke-width="1"/>
  <path d="M 594 278 C 633 278 655 275 676 260 C 693 246 704 223 729 221 C 749 220 760 244 776 261 C 797 277 824 278 895 278" fill="none" stroke="#a7b2bd" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M 594 278 C 629 278 645 275 661 260 C 677 243 682 223 703 221 C 725 219 740 247 756 262 C 776 277 810 278 895 278 L 594 278 Z" fill="#2b9697" fill-opacity="0.09"/>
  <path d="M 594 278 C 629 278 645 275 661 260 C 677 243 682 223 703 221 C 725 219 740 247 756 262 C 776 277 810 278 895 278" fill="none" stroke="#2b9697" stroke-width="2.6" stroke-linecap="round"/>
  <text x="882" y="294" fill="#8793a0" font-family="Noto Sans, Arial, sans-serif" font-size="16">a</text>

  <text x="480" y="327" text-anchor="middle" fill="#566474" font-family="Noto Sans, Arial, sans-serif" font-size="20">π<tspan baseline-shift="sub" font-size="13">target</tspan><tspan> (a | o) ∝ r</tspan><tspan baseline-shift="sub" font-size="13">rule</tspan><tspan> (o, a) π</tspan><tspan baseline-shift="sub" font-size="13">old</tspan><tspan> (a | o)</tspan></text>
</svg>
